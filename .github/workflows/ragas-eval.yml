name: RAGAS Eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ragas-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-local-embedding.txt
      - name: Install evaluation dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt -r backend/requirements-local-embedding.txt
      - name: Start Milvus
        run: |
          docker compose up -d milvus
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 2 --max-time 5 http://127.0.0.1:9091/healthz
      - name: Run the fixed handbook evaluation
        id: eval
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/repolens-ragas.sqlite3
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LOCAL_EMBEDDING_DEVICE: cpu
          OMP_NUM_THREADS: "2"
        run: python ../scripts/run_ragas_ci.py --output "$RUNNER_TEMP/ragas-eval.json"
      - name: Upload per-case results
        if: ${{ !cancelled() && steps.eval.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval
          path: ${{ runner.temp }}/ragas-eval.json
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: ${{ failure() }}
        run: docker compose logs --tail=80
